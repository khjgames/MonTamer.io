<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>MonTamer.io - Monster Taming Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #game-container canvas {
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            z-index: 1000;
        }
        #connection-status {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            z-index: 1000;
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            #ui {
                font-size: 14px;
                top: 5px;
                left: 5px;
            }
            #connection-status {
                font-size: 12px;
                top: 5px;
                right: 5px;
            }
        }
        
        /* Portrait orientation styles */
        @media (orientation: portrait) and (max-width: 768px) {
            #ui {
                font-size: 12px;
            }
            #connection-status {
                font-size: 10px;
            }
        }
        
        /* Prevent zoom on double tap */
        * {
            touch-action: manipulation;
        }
    </style>

  <link rel="modulepreload" crossorigin href="./assets/phaser-D3dYiAfh.js">
  <link rel="modulepreload" crossorigin href="./assets/colyseus-B6_9Nfu6.js">
</head>
<body>
    <div id="ui">
        <div>Ping: <span id="ping">--</span>ms | Packet Loss: <span id="packet-loss">--</span>%</div>
        <div>Players: <span id="player-count">0</span>/100 | FPS: <span id="fps">--</span></div>
    </div>
    <div id="connection-status">Connecting...</div>
    <div id="game-container"></div>

</body>
</html>
